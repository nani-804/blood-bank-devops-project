apiVersion: apps/v1
kind: Deployment

metadata:
  name: bloodbank-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: bloodbank

  template:
    metadata:
      labels:
        app: bloodbank

    spec:
      containers:
      - name: bloodbank-container
        image: bloodbank-app
        ports:
        - containerPort: 80
